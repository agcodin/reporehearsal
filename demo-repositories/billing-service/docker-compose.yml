services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: rehearsal, POSTGRES_PASSWORD: rehearsal, POSTGRES_DB: billing }
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rehearsal"], interval: 3s, timeout: 3s, retries: 10 }
  billing-api:
    build: .
    environment: { DATABASE_URL: "postgresql://rehearsal:rehearsal@postgres:5432/billing" }
    depends_on: { postgres: { condition: service_healthy } }
    ports: ["4000:4000"]
